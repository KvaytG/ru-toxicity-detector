[project]
name = "ru-toxicity-detector"
version = "3.0.0"
description = "Russian toxicity detection powered by a pretrained transformer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["toxicity_detector*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
